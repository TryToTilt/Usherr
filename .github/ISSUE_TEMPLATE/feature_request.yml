name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Check [FEATURES.md](https://github.com/TryToTilt/Usherr/blob/main/docs/FEATURES.md) first, it lists what Usherr does today.

  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you are trying to do and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How could Usherr help?
      description: Your idea for how it could work. Screenshots from other apps are welcome.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
