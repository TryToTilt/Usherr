# The title fields of the public Nyaa definition, which lean on look-around,
# with an address that goes nowhere. Read by cardigann_regex_test.go.
id: fixturenyaa
name: Fixture Nyaa
description: "Look-around in a definition's fields"
language: en-US
type: public
encoding: UTF-8
links:
  - https://nyaa.invalid/

caps:
  categorymappings:
    - {id: 1_2, cat: TV/Anime, desc: "Anime - English-translated"}
    - {id: 3_1, cat: Books, desc: "Literature - English-translated"}
    - {id: 4_1, cat: TV, desc: "Live Action - English-translated"}
  modes:
    search: [q]

settings:
  - name: sonarr_compatibility
    type: checkbox
    label: Season information
    default: false
  - name: radarr_compatibility
    type: checkbox
    label: Year information
    default: false

search:
  paths:
    - path: /
      inputs:
        q: "{{ .Keywords }}"

  rows:
    selector: tr.default,tr.danger,tr.success

  fields:
    category:
      selector: td:nth-child(1) a
      attribute: href
      filters:
        - name: split
          args: ["=", -1]
    category_group_id:
      selector: td:nth-child(1) a
      attribute: href
      filters:
        - name: split
          args: ["=", -1]
        - name: split
          args: ["_", 0]
    title_default:
      selector: td:nth-child(2) a:last-of-type
    title_phase1:
      selector: td:nth-child(2) a:last-of-type:contains("[PuyaSubs!] ")
      optional: true
      filters:
        - name: append
          args: " Spanish"
    title_keyword_year:
      text: "{{ .Query.Keywords }}"
      filters:
        - name: regexp
          args: "\\b((19|20)\\d{2})\\b"
    title_phase2:
      text: "{{ or (.Result.title_phase1) (.Result.title_default) }}"
      filters:
        - name: re_replace
          args: ["^(\\[.+?\\] ?)?(\\[.+?\\] ?)?(.+?)(\\[)", "$1$2$3{{ if and (.Config.radarr_compatibility) (.Result.title_keyword_year) }} {{ .Result.title_keyword_year }} $4{{ else }}$4{{ end }}"]
    title_phase3:
      text: "{{ .Result.title_phase2 }}"
      filters:
        - name: re_replace
          args: ["(?i)\\b(?:S|Seasons?)\\s?(\\d+(?:-\\d+)?)(?:.+?)(?:EP|Episodes?)\\s?(\\d+(?:-\\d+)?)\\b(?!(?:-\\d+)?\\sS\\d+(?:-\\d+)?E\\d+(?:-\\d+)?)", "S$1E$2"]
        - name: re_replace
          args: ["(?i)\\b(?:S\\s|Seasons?\\s?)(\\d+(?:-\\d+)?)\\b(?!(?:-\\d+)?\\s(?:EP|Episodes?)?\\s?(?:\\d+(?:-\\d+)?)?\\s?S\\d+(?:E\\d+(?:-\\d+)?)?)", "S$1"]
        - name: re_replace
          args: ["(?i)\\b(?:EP|Episodes?)\\s?(\\d+(?:-\\d+)?)\\b(?!(?:-\\d+)?\\sS\\d+(?:-\\d+)?(?:E\\d+(?:-\\d+)?)?)", "S01E$1"]
        - name: re_replace
          args: ["\\s+", " "]
        - name: trim
    title_has_season:
      text: "{{ .Result.title_phase3 }}"
      filters:
        - name: regexp
          args: "(?i)(S\\d{1,3}([Ev]\\d+)?)"
        - name: append
          args: "NULL"
    title_has_episode:
      text: "{{ .Result.title_phase3 }}"
      filters:
        - name: regexp
          args: "\\b(.+? - ?)(\\d+([-v]\\d+)?) ([\\[\\(])\\b"
        - name: append
          args: "NULL"
    title_has_movie_ova:
      text: "{{ .Result.title_phase3 }}"
      filters:
        - name: regexp
          args: "(?i)(?<![A-Za-z0-9])(Movies?|OVA|OAV)(?![A-Za-z0-9])"
        - name: re_replace
          args: ["(?i)(Movies?|OVA|OAV)", "YES"]
    title_optional:
      text: "{{ .Result.title_phase3 }}"
      filters:
        - name: re_replace
          args: ["^(\\[.+?].+?)\\s*(?<![\\]\\)])((?:\\[|\\(| - ).+)", "{{ if and (and (eq .Result.category_group_id \"1\") (ne .Result.title_has_movie_ova \"YES\")) (and (eq .Result.title_has_season \"NULL\") (eq .Result.title_has_episode \"NULL\")) }}$1 S01 $2{{ else }}$1 $2{{ end }}"]
    title_live_action:
      text: "{{ .Result.title_optional }}"
      filters:
        - name: re_replace
          args: ["^(.+?)([\\. ])((?:19|20)\\d{2})([\\. ])(.+)$", "{{ if and (eq .Result.category_group_id \"4\") (and (eq .Result.title_has_season \"NULL\") (eq .Result.title_has_episode \"NULL\")) }}$1$2$3$4S01$4$5{{ else }}$1$2$3$4$5{{ end }}"]
        - name: re_replace
          args: ["^(?!.*(?:19|20)\\d{2})(.+?)([\\. ])((?:480|720|1080|2160)[pi])(.*)$", "{{ if and (eq .Result.category_group_id \"4\") (and (eq .Result.title_has_season \"NULL\") (eq .Result.title_has_episode \"NULL\")) }}$1$2S01$2$3$4{{ else }}$1$2$3$4{{ end }}"]
    title:
      text: "{{ if .Config.sonarr_compatibility }}{{ .Result.title_live_action }}{{ else }}{{ .Result.title_phase2 }}{{ end }}"
    details:
      selector: td:nth-child(2) a:last-of-type
      attribute: href
    magnet:
      selector: td:nth-child(3) a[href^="magnet:?"]
      attribute: href
    size:
      selector: td:nth-child(4)
    date:
      selector: td:nth-child(5)
      filters:
        - name: append
          args: " -00:00"
        - name: dateparse
          args: "yyyy-MM-dd HH:mm zzz"
    seeders:
      selector: td:nth-child(6):not(:empty)
      optional: true
      default: 0
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
